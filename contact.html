<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Theory House</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <img class="logo" src="/images/logo.svg" alt="Theory House logo">
        <span class="site-title">Theory House</span>
      </a>
      <nav class="site-nav">
        <a href="/index.html">Home</a>
        <a href="/services.html">Services</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <h1>Contact Us</h1>
    <p>If you’d like to get a quote or request a service, email us at <a href="mailto:theoryhouse@example.com">theoryhouse@example.com</a>.</p>

    <h2>Request a Quote</h2>
    <form class="contact-form" action="#" method="post">
      <label>Name<br><input type="text" name="name" required></label>
      <label>Email<br><input type="email" name="email" required></label>
      <label>Service required<br>
        <select name="service">
          <option>Essay & Assignment</option>
          <option>Thesis & Dissertation</option>
          <option>Editing & Proofreading</option>
        </select>
      </label>
      <label>Details<br><textarea name="details" rows="6"></textarea></label>
      <p><button type="submit">Send request</button></p>
    </form>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Theory House</p>
    </div>
  </footer>
</body>
</html>
